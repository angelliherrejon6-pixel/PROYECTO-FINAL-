spring.application.name=aspirest
spring.datasource.url=jdbc:postgresql://db:5432/musica
spring.datasource.username=musica
spring.datasource.password=musica
spring.jpa.hibernate.ddl-auto=update

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

jwt.secret=${JWT_SECRET:UnaClaveSecretaMuySeguraParaFirmarLosTokensJWT}
jwt.expiracion-minutos=60

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

